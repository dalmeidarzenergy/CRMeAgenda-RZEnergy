<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZEnergy CRM</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#0f766e;--ac2:#fff;--dg:#b91c1c;
--s1:#fef3c7;--t1:#92400e;--s2:#dcfce7;--t2:#166534;--s3:#fee2e2;--t3:#991b1b;--s4:#e5e7eb;--t4:#374151;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--sf:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#2dd4bf;--ac2:#06201d;--dg:#f87171;
--s1:#422006;--t1:#fcd34d;--s2:#052e16;--t2:#86efac;--s3:#450a0a;--t3:#fca5a5;--s4:#2c333c;--t4:#d1d5db;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--sf:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#2dd4bf;--ac2:#06201d;--dg:#f87171;--s1:#422006;--t1:#fcd34d;--s2:#052e16;--t2:#86efac;--s3:#450a0a;--t3:#fca5a5;--s4:#2c333c;--t4:#d1d5db;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:17px;margin-right:12px}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--mu);font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ac2)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
.btn{background:var(--ac);color:var(--ac2);border:0;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.g{background:var(--s4);color:var(--tx)}.btn.d{background:var(--s3);color:var(--t3)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto;flex:1;min-width:130px}.bar .btn{flex:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);font-weight:600}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.e0{background:var(--s4);color:var(--t4)}.e1{background:var(--s1);color:var(--t1)}.e2{background:var(--s2);color:var(--t2)}.e3{background:var(--s3);color:var(--t3)}
.tp{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin:0 3px 3px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cal .h{background:var(--bg);padding:6px;text-align:center;font-size:12px;color:var(--mu)}
.cal .d{background:var(--sf);min-height:92px;padding:4px;cursor:pointer;overflow:hidden}.cal .d.o{opacity:.45}
.cal .d.t .n{background:var(--ac);color:var(--ac2);border-radius:99px;padding:0 6px}.n{font-size:12px}
.ev{font-size:11px;background:var(--s2);color:var(--t2);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.x{background:var(--s1);color:var(--t1)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal>div{background:var(--sf);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px}.row>*{flex:1}.chk{display:flex;gap:12px;flex-wrap:wrap}.chk label{display:flex;gap:5px;align-items:center;margin:0;font-size:14px;color:var(--tx)}.chk input{width:auto}
.login{max-width:360px;margin:12vh auto}.mu{color:var(--mu);font-size:13px}.err{color:var(--dg);font-size:13px;margin-top:8px}
.rp{border-bottom:1px solid var(--bd);padding:10px 0}.rp:last-child{border:0}
@media(max-width:640px){.cal .d{min-height:64px}.ev{font-size:10px}}
.logo{padding:2px 0;display:inline-flex;margin-right:12px}.logo img{height:28px;width:auto;display:block}
.calw{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}.up{margin-bottom:0}@media(max-width:860px){.calw{grid-template-columns:1fr}}
</style>
</head>

let db=null,S={users:[],clientes:[],eventos:[],reports:[]},ready={},me=null,view='cal',cur=new Date(),fCom='',F={q:'',e:'',t:''},pg=1,loadErr='';
const COLS=Object.keys(S);
const sget=()=>{try{return sessionStorage.getItem('crm_uid')}catch(e){return null}};
const sset=v=>{try{v?sessionStorage.setItem('crm_uid',v):sessionStorage.removeItem('crm_uid')}catch(e){}};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('crm:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const isA=()=>me&&me.role==='admin';
const uname=id=>(S.users.find(u=>u.id===id)||{}).nome||'—';
const myC=()=>isA()?S.clientes:S.clientes.filter(c=>c.comId===me.id);
const cname=id=>(S.clientes.find(c=>c.id===id)||{}).nome||'—';
const close=()=>{$('#modal').style.display='none'};
const open=h=>{$('#mb').innerHTML=h;$('#modal').style.display='flex'};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
const val=id=>$('#'+id).value.trim();
const ask=(msg,ok='Apagar')=>new Promise(r=>{open('<h2>'+esc(msg)+'</h2><div class="bar" style="margin:14px 0 0"><button class="btn d" id="ay">'+ok+'</button><button class="btn g" id="an">Cancelar</button></div>');$('#ay').onclick=()=>{close();r(true)};$('#an').onclick=()=>{close();r(false)}});
const askText=msg=>new Promise(r=>{open('<h2>'+esc(msg)+'</h2><input id="pi" type="password"><div class="bar" style="margin:14px 0 0"><button class="btn" id="ay">Guardar</button><button class="btn g" id="an">Cancelar</button></div>');$('#ay').onclick=()=>{const v=$('#pi').value;close();r(v)};$('#an').onclick=()=>{close();r(null)}});
async function delCli(c){
  if(!c||!await ask('Apagar o cliente '+c.nome+' e os respetivos reports? Esta ação não pode ser desfeita.'))return;
  try{
    for(const r of S.reports.filter(r=>r.clienteId===c.id)){try{await db.collection('reports').doc(r.id).delete()}catch(e){}}
    for(const v of S.eventos.filter(v=>v.clienteId===c.id)){try{await db.collection('eventos').doc(v.id).update({clienteId:''})}catch(e){}}
    await db.collection('clientes').doc(c.id).delete();
  }catch(e){open('<h2>Não foi possível apagar</h2><p class="mu">'+esc(e.message||'Erro desconhecido.')+'</p><button class="btn g" id="an">Fechar</button>');$('#an').onclick=close}
}

let setup=false,timer=null;
const api=async(m,p,b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&p!=='login'&&me){me=null;stop();render()}throw Object.assign(new Error(j.error||'Erro de ligação.'),{status:r.status})}return j};
const stop=()=>{clearInterval(timer);timer=null;ready={}};
const busy=()=>document.activeElement&&document.activeElement.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
const pullAll=async()=>{await Promise.all(COLS.map(async k=>{try{S[k]=await api('GET',k);ready[k]=true}catch(e){if(e.status!==401)loadErr=e.message}}));render()};
const start=async()=>{await pullAll();clearInterval(timer);timer=setInterval(()=>{if(me&&!document.hidden&&!busy())pullAll()},8000)};
db={collection:k=>({add:async d=>{const r=await api('POST',k,d);await pullAll();return r},
  doc:id=>({set:async d=>{await api('PUT',k+'/'+id,d);await pullAll()},update:async d=>{await api('PATCH',k+'/'+id,d);await pullAll()},delete:async()=>{await api('DELETE',k+'/'+id);await pullAll()}})})};
async function init(){
  $('#app').innerHTML='<p class="mu" style="padding:20px">A carregar…</p>';
  try{const j=await api('GET','me');setup=j.setup;me=j.me}catch(e){loadErr='Não foi possível ligar ao servidor.';render();return}
  if(me)start();else render();
}

function render(){
  const a=$('#app');
  if(loadErr){a.innerHTML='<p class="err" style="padding:20px">'+esc(loadErr)+'</p>';return}
  if(me&&!COLS.every(k=>ready[k]))return;
  if(!me){
    const first=setup;
    a.innerHTML='<div class="card login"><div style="text-align:center;margin-bottom:12px"><span class="logo" style="margin:0"><img src="'+LOGO+'" alt="RZEnergy" style="height:46px"></span></div><h2>'+(first?'Criar conta de Administrador':'Entrar no CRM')+'</h2>'+
    (first?'<p class="mu">Primeira utilização: crie o administrador principal.</p><label>Nome</label><input id="ln">':'')+
    '<label>Utilizador</label><input id="lu" autocomplete="username"><label>Palavra-passe</label><input id="lp" type="password" autocomplete="current-password">'+
    '<p class="err" id="le"></p><button class="btn" style="width:100%;margin-top:8px" id="lb">'+(first?'Criar e entrar':'Entrar')+'</button><div style="text-align:center;margin-top:18px"><img src="'+IBER+'" alt="Colaborador Oficial Iberdrola" style="height:34px;max-width:100%"></div></div>';
    const go=async()=>{const u=val('lu').toLowerCase(),p=$('#lp').value;if(!u||!p){$('#le').textContent='Preencha todos os campos.';return}
      try{const j=await api('POST',first?'setup':'login',{user:u,pass:p,nome:first?val('ln'):undefined});me=j.me;setup=false;view='cal';await start()}catch(e){$('#le').textContent=e.message}};
    $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};return}
  const tabs=[['cal','Calendário'],['cli','Clientes'],['rep','Report']].concat(isA()?[['usr','Utilizadores']]:[]);
  a.innerHTML='<header><span class="logo"><img src="'+LOGO+'" alt="RZEnergy"></span><nav>'+tabs.map(t=>'<button class="'+(view===t[0]?'on':'')+'" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</nav>'+
  '<span class="mu">'+esc(me.nome)+' · '+(isA()?'Admin':'Comercial')+'</span><button class="btn g" id="out">Sair</button></header><main id="mn"></main><div style="text-align:center;padding:4px 0 18px"><img src="'+IBER+'" alt="Colaborador Oficial Iberdrola" style="height:34px;max-width:100%"></div>';
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  $('#out').onclick=async()=>{try{await api('POST','logout')}catch(e){}me=null;stop();S={users:[],clientes:[],eventos:[],reports:[]};render()};
  ({cal:vCal,cli:vCli,rep:vRep,usr:vUsr})[view]();
}

/* ---------- Calendário ---------- */
function vCal(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
  const evs=S.eventos.filter(e=>isA()?(!fCom||e.donoId===fCom):e.donoId===me.id);
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const today=iso(new Date());let cells='';
  for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
    const de=evs.filter(e=>e.data===k).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
    cells+='<div class="d'+(d.getMonth()!==m?' o':'')+(k===today?' t':'')+'" data-d="'+k+'"><span class="n">'+d.getDate()+'</span>'+
    de.slice(0,3).map(e=>'<div class="ev'+(e.donoId!==me.id?' x':'')+'" data-e="'+e.id+'">'+esc(e.hora||'')+' '+esc(e.titulo)+'</div>').join('')+(de.length>3?'<div class="mu" style="font-size:11px">+'+(de.length-3)+'</div>':'')+'</div>'}
  const prox=evs.filter(e=>e.data>=today).sort((a,b)=>(a.data+(a.hora||'')).localeCompare(b.data+(b.hora||''))).slice(0,8);
  const dl=k=>{const dd=new Date(k+'T00:00'),df=Math.round((dd-new Date(today+'T00:00'))/864e5);return df===0?'Hoje':df===1?'Amanhã':dd.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'})};
  const up='<div class="card up"><h2>Próximos eventos</h2>'+(prox.map(e=>'<div class="rp" data-e="'+e.id+'" style="cursor:pointer"><b>'+dl(e.data)+'</b> <span class="mu">'+esc(e.hora||'')+'</span><div>'+esc(e.titulo)+'</div><div class="mu">'+[e.clienteId?cname(e.clienteId):'',isA()&&e.donoId?uname(e.donoId):''].filter(Boolean).map(esc).join(' · ')+'</div></div>').join('')||'<p class="mu">Sem eventos agendados.</p>')+'</div>';
  $('#mn').innerHTML='<div class="calw"><div class="card" style="min-width:0"><div class="bar"><button class="btn g" id="pv">‹</button><b style="flex:2;text-align:center;align-self:center">'+MESES[m]+' '+y+'</b><button class="btn g" id="nx">›</button><button class="btn g" id="td">Hoje</button>'+
  (isA()?'<select id="fc"><option value="">Todos os calendários</option>'+S.users.map(u=>'<option value="'+u.id+'"'+(fCom===u.id?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select>':'')+
  '<button class="btn" id="ne">+ Evento</button></div><div class="cal">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>'<div class="h">'+x+'</div>').join('')+cells+'</div>'+
  (isA()?'<p class="mu">Eventos a amarelo pertencem a outros utilizadores.</p>':'')+'</div>'+up+'</div>';
  $('#pv').onclick=()=>{cur=new Date(y,m-1,1);vCal()};$('#nx').onclick=()=>{cur=new Date(y,m+1,1);vCal()};$('#td').onclick=()=>{cur=new Date();vCal()};
  if(isA())$('#fc').onchange=e=>{fCom=e.target.value;vCal()};
  $('#ne').onclick=()=>evModal(null,today);
  document.querySelectorAll('.up [data-e]').forEach(el=>el.onclick=()=>evModal(S.eventos.find(x=>x.id===el.dataset.e)));
  document.querySelectorAll('.cal .d').forEach(el=>el.onclick=ev=>{const t=ev.target.closest('[data-e]');t?evModal(S.eventos.find(x=>x.id===t.dataset.e)):evModal(null,el.dataset.d)});
}
function evModal(e,date){
  const o=e||{titulo:'',data:date,hora:'',clienteId:'',donoId:me.id,notas:''};
  const cl=isA()?S.clientes:myC();
  open('<h2>'+(e?'Editar evento':'Novo evento')+'</h2><label>Título</label><input id="et" value="'+esc(o.titulo)+'"><div class="row"><div><label>Data</label><input id="ed" type="date" value="'+o.data+'"></div><div><label>Hora</label><input id="eh" type="time" value="'+esc(o.hora)+'"></div></div>'+
  '<label>Cliente (opcional)</label><select id="ec"><option value="">—</option>'+cl.map(c=>'<option value="'+c.id+'"'+(c.id===o.clienteId?' selected':'')+'>'+esc(c.nome)+'</option>').join('')+'</select>'+
  (isA()?'<label>Calendário de</label><select id="eo">'+S.users.map(u=>'<option value="'+u.id+'"'+(u.id===o.donoId?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select>':'')+
  '<label>Notas</label><textarea id="en" rows="3">'+esc(o.notas)+'</textarea><div class="bar" style="margin:14px 0 0"><button class="btn" id="sv">Guardar</button>'+(e?'<button class="btn d" id="dl">Apagar</button>':'')+'<button class="btn g" id="cx">Cancelar</button></div>');
  $('#cx').onclick=close;
  $('#sv').onclick=async()=>{const t=val('et');if(!t||!$('#ed').value)return;
    const d={titulo:t,data:$('#ed').value,hora:$('#eh').value,clienteId:$('#ec').value,donoId:isA()?$('#eo').value:me.id,notas:val('en')};
    e?await db.collection('eventos').doc(e.id).set(d):await db.collection('eventos').add(d);close()};
  if(e)$('#dl').onclick=async()=>{await db.collection('eventos').doc(e.id).delete();close()};
}

/* ---------- Clientes ---------- */
function vCli(){
  $('#mn').innerHTML='<div class="card"><h2>Clientes</h2><div class="bar"><input id="fq" placeholder="Pesquisar nome, NIF, telefone…" value="'+esc(F.q)+'">'+
  '<select id="fe"><option value="">Todos os estados</option>'+ESTADOS.map(s=>'<option'+(F.e===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
  '<select id="ft"><option value="">Todos os serviços</option>'+TIPOS.map(s=>'<option'+(F.t===s?' selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" id="nc">+ Novo cliente</button></div>'+
  ''+(isA()?'<div class="bar"><select id="bt">'+S.users.map(u=>'<option value="'+u.id+'">'+esc(u.nome)+'</option>').join('')+'</select><button class="btn" id="bb">Atribuir selecionados</button><span class="mu" id="bm"></span></div>':'')+'<div class="tw"><table><thead><tr>'+(isA()?'<th><input type="checkbox" id="ca" style="width:auto"></th>':'')+'<th>Cliente</th><th>Contacto</th><th>Serviços</th><th>Estado</th>'+(isA()?'<th>Comercial</th>':'')+'</tr></thead><tbody id="tb"></tbody></table></div><div class="bar" id="pgn" style="margin:12px 0 0;align-items:center"></div></div>';
  const t=()=>{const q=F.q.toLowerCase();
    const l=myC().filter(c=>(!F.e||c.estado===F.e)&&(!F.t||(c.tipos||[]).includes(F.t))&&(!q||[c.nome,c.nif,c.tel,c.email].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.nome.localeCompare(b.nome));
    const np=Math.max(1,Math.ceil(l.length/20));if(pg>np)pg=np;const pl=l.slice((pg-1)*20,pg*20);
    $('#pgn').innerHTML=l.length?'<span class="mu">'+l.length+' cliente(s) · página '+pg+' de '+np+'</span><button class="btn g" id="pp"'+(pg<=1?' disabled':'')+'>‹ Anterior</button><button class="btn g" id="pn"'+(pg>=np?' disabled':'')+'>Seguinte ›</button>':'';
    if(l.length){$('#pp').onclick=()=>{pg--;t()};$('#pn').onclick=()=>{pg++;t()}}
    $('#tb').innerHTML=pl.map(c=>'<tr data-c="'+c.id+'">'+(isA()?'<td><input type="checkbox" class="sk" value="'+c.id+'" style="width:auto"></td>':'')+'<td><b>'+esc(c.nome)+'</b><div class="mu">NIF '+esc(c.nif||'—')+'</div></td><td>'+esc(c.tel||'')+'<div class="mu">'+esc(c.email||'')+'</div></td><td>'+(c.tipos||[]).map(x=>'<span class="tp">'+x+'</span>').join('')+'</td><td>'+badge(c.estado)+'</td>'+(isA()?'<td style="white-space:nowrap">'+esc(uname(c.comId))+' <button class="btn d" data-del="'+c.id+'" style="padding:2px 8px;font-size:12px;margin-left:6px">Apagar</button></td>':'')+'</tr>').join('')||'<tr><td class="mu" colspan="5">Sem clientes.</td></tr>';
    document.querySelectorAll('#tb tr[data-c]').forEach(r=>r.onclick=e=>{if(!['INPUT','BUTTON'].includes(e.target.tagName))cliModal(S.clientes.find(c=>c.id===r.dataset.c))})};
  $('#fq').oninput=e=>{F.q=e.target.value;pg=1;t()};$('#fe').onchange=e=>{F.e=e.target.value;pg=1;t()};$('#ft').onchange=e=>{F.t=e.target.value;pg=1;t()};$('#nc').onclick=()=>cliModal(null);$('#tb').onclick=e=>{const b=e.target.closest('[data-del]');if(b)delCli(S.clientes.find(x=>x.id===b.dataset.del))};t();
  if(isA()){$('#ca').onchange=e=>document.querySelectorAll('.sk').forEach(x=>x.checked=e.target.checked);
    $('#bb').onclick=async()=>{const ids=[...document.querySelectorAll('.sk:checked')].map(x=>x.value);if(!ids.length){$('#bm').textContent='Selecione primeiro os clientes.';return}
      for(const id of ids)await db.collection('clientes').doc(id).update({comId:$('#bt').value})}}
}
function cliModal(c){
  const o=c||{nome:'',nif:'',tel:'',email:'',morada:'',tipos:[],consumo:'',notas:'',estado:'Em espera',comId:me.id};
  open('<h2>'+(c?'Editar cliente':'Novo cliente')+'</h2><label>Nome / Empresa</label><input id="cn" value="'+esc(o.nome)+'"><div class="row"><div><label>NIF</label><input id="cf" value="'+esc(o.nif)+'"></div><div><label>Telefone</label><input id="ct" value="'+esc(o.tel)+'"></div></div>'+
  '<label>Email</label><input id="ce" type="email" value="'+esc(o.email)+'"><label>Morada</label><input id="cm" value="'+esc(o.morada)+'">'+
  '<label>Serviços</label><div class="chk">'+TIPOS.map(t=>'<label><input type="checkbox" class="tk" value="'+t+'"'+((o.tipos||[]).includes(t)?' checked':'')+'>'+t+'</label>').join('')+'</div>'+
  '<label>Consumo / potência / fornecedor atual</label><input id="cc" value="'+esc(o.consumo)+'"><label>Estado</label><select id="cs">'+ESTADOS.map(s=>'<option'+(o.estado===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
  (isA()?'<label>Comercial responsável</label><select id="co">'+S.users.map(u=>'<option value="'+u.id+'"'+(u.id===o.comId?' selected':'')+'>'+esc(u.nome)+'</option>').join('')+'</select>':'')+
  '<label>Notas</label><textarea id="cx2" rows="3">'+esc(o.notas)+'</textarea>'+(c?'<label>Reports deste cliente</label>'+(S.reports.filter(r=>r.clienteId===c.id).sort((a,b)=>b.ts-a.ts).map(r=>'<div class="rp">'+badge(r.estado)+' <span class="mu">'+esc(uname(r.autorId))+' · '+new Date(r.ts).toLocaleString('pt-PT')+'</span><div style="white-space:pre-wrap">'+esc(r.texto)+'</div></div>').join('')||'<p class="mu">Ainda sem reports.</p>'):'')+'<div class="bar" style="margin:14px 0 0"><button class="btn" id="sv">Guardar</button>'+(c&&isA()?'<button class="btn d" id="dl">Apagar</button>':'')+'<button class="btn g" id="cx">Cancelar</button></div>');
  $('#cx').onclick=close;
  $('#sv').onclick=async()=>{const n=val('cn');if(!n)return;
    const d={nome:n,nif:val('cf'),tel:val('ct'),email:val('ce'),morada:val('cm'),tipos:[...document.querySelectorAll('.tk:checked')].map(x=>x.value),consumo:val('cc'),estado:$('#cs').value,comId:isA()?$('#co').value:(o.comId||me.id),notas:val('cx2')};
    c?await db.collection('clientes').doc(c.id).set(d):await db.collection('clientes').add(d);close()};
  if(c&&isA())$('#dl').onclick=()=>delCli(c);
}

/* ---------- Report ---------- */
function vRep(){
  const cl=myC().slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const rs=S.reports.filter(r=>isA()||r.autorId===me.id).sort((a,b)=>b.ts-a.ts);
  $('#mn').innerHTML='<div class="card"><h2>Novo report</h2>'+(cl.length?'<div class="row"><div><label>Cliente</label><select id="rc">'+cl.map(c=>'<option value="'+c.id+'">'+esc(c.nome)+'</option>').join('')+'</select></div><div><label>Estado do cliente</label><select id="rs">'+ESTADOS.map(s=>'<option>'+s+'</option>').join('')+'</select></div></div>'+
  '<label>Report (contacto, proposta, próximos passos…)</label><textarea id="rt" rows="4"></textarea><div style="margin-top:12px"><button class="btn" id="rb">Submeter report</button></div>':'<p class="mu">Ainda não tem clientes atribuídos.</p>')+'</div>'+
  '<div class="card"><h2>Histórico de reports</h2>'+(rs.map(r=>'<div class="rp"><div><b>'+esc(cname(r.clienteId))+'</b> '+badge(r.estado)+'</div><div class="mu">'+esc(uname(r.autorId))+' · '+new Date(r.ts).toLocaleString('pt-PT')+'</div><div style="white-space:pre-wrap;margin-top:4px">'+esc(r.texto)+'</div></div>').join('')||'<p class="mu">Sem reports.</p>')+'</div>';
  if(!cl.length)return;
  const sync=()=>{const c=S.clientes.find(x=>x.id===$('#rc').value);if(c)$('#rs').value=c.estado};sync();$('#rc').onchange=sync;
  $('#rb').onclick=async()=>{const t=val('rt');if(!t)return;const id=$('#rc').value,e=$('#rs').value;
    await db.collection('reports').add({clienteId:id,autorId:me.id,estado:e,texto:t,ts:Date.now()});
    await db.collection('clientes').doc(id).update({estado:e})};
}

/* ---------- Utilizadores (admin) ---------- */
function vUsr(){
  $('#mn').innerHTML='<div class="card"><h2>Novo utilizador</h2><div class="row"><div><label>Nome</label><input id="un"></div><div><label>Utilizador</label><input id="uu"></div></div><div class="row"><div><label>Palavra-passe</label><input id="up" type="password"></div><div><label>Perfil</label><select id="ur"><option value="comercial">Comercial</option><option value="admin">Admin</option></select></div></div><p class="err" id="ue"></p><button class="btn" id="ub">Criar utilizador</button></div>'+
  '<div class="card"><h2>Transferir clientes</h2><div class="row"><div><label>De</label><select id="tf">'+S.users.map(u=>'<option value="'+u.id+'">'+esc(u.nome)+'</option>').join('')+'</select></div><div><label>Para</label><select id="tt">'+S.users.map(u=>'<option value="'+u.id+'">'+esc(u.nome)+'</option>').join('')+'</select></div></div><p class="mu" id="tm">Passa todos os clientes de um comercial para outro.</p><button class="btn" id="tx">Transferir todos</button></div><div class="card"><h2>Utilizadores</h2><div class="tw"><table><thead><tr><th>Nome</th><th>Utilizador</th><th>Perfil</th><th></th></tr></thead><tbody>'+S.users.map(u=>'<tr style="cursor:default"><td>'+esc(u.nome)+'</td><td>'+esc(u.user)+'</td><td>'+(u.role==='admin'?'Admin':'Comercial')+'</td><td>'+(u.id!==me.id?'<button class="btn g" data-p="'+u.id+'">Repor senha</button> <button class="btn d" data-x="'+u.id+'">Apagar</button>':'')+'</td></tr>').join('')+'</tbody></table></div></div>';
  $('#ub').onclick=async()=>{const n=val('un'),u=val('uu').toLowerCase(),p=$('#up').value;
    if(!n||!u||!p){$('#ue').textContent='Preencha todos os campos.';return}
    if(S.users.some(x=>x.user===u)){$('#ue').textContent='Esse utilizador já existe.';return}
    await db.collection('users').add({nome:n,user:u,pass:p,role:$('#ur').value})};
  $('#tx').onclick=async()=>{const a=$('#tf').value,b=$('#tt').value;if(a===b){$('#tm').textContent='Escolha dois utilizadores diferentes.';return}
    const l=S.clientes.filter(c=>c.comId===a);if(!l.length){$('#tm').textContent='Esse utilizador não tem clientes.';return}
    if(!await ask('Transferir '+l.length+' cliente(s) para '+uname(b)+'?','Transferir'))return;for(const c of l)await db.collection('clientes').doc(c.id).update({comId:b})};
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(await ask('Apagar este utilizador?'))await db.collection('users').doc(b.dataset.x).delete()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{const p=await askText('Nova palavra-passe (mín. 6 caracteres)');if(p)await db.collection('users').doc(b.dataset.p).update({pass:p})});
}
init();
</script>
</body>
</html>
